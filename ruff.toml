# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "githooks",
    # Actual source files
    "src/*/phantoms/FORBILD_head.py",
    "conftest.py",
    "src/*/gbc/filters.py",  # vendored from legacy `apricot` module
]

line-length = 79
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[lint]
# Enable preview features.
preview = true

select = ["E4", "E7", "E9", "F", "D"]
extend-select = ["ANN", "W", "COM", "C4", "EM", "EXE", "FIX", "unconventional-import-alias", "PIE",
"RET", "SLF", "typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import", "runtime-import-in-type-checking-block", "empty-type-checking-block", "runtime-string-union", "ARG", "I",
"C90", "NPY", "N", "PERF", "DOC", "PLC", "PLE", "PLW", "UP", "RUF", "TRY",
"E"]
ignore = ["unnecessary-comprehension", "E22", "multiple-leading-hashes-for-block-comment", "line-too-long", "ambiguous-variable-name", "redundant-open-modes", "f-string", "multiple-spaces-after-comma", "undefined-local-with-import-star", "missing-trailing-comma"] # ruff complains if COM812 is included,
# because it's redundant with ruff-format. Adding to ignore list to suppress
# the warning. ruff-format should add in any missing trailing commas.

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pydocstyle]
convention = "numpy"

[lint.pydoclint]
# Skip docstrings which fit on a single line.
ignore-one-line-docstrings = true

# Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[lint.per-file-ignores]
"__init__.py" = ["module-import-not-at-top-of-file"]

[lint.flake8-type-checking]
# Enforce quotes around type annotations, in the event that doing so would allow us to avoid importing at runtime, by using an if TYPE_CHECKING block. Has no effect on Python 3.14+ because the type annotations are equivalent to quoted types from that version of Python and onwards. See https://docs.astral.sh/ruff/rules/typing-only-first-party-import/
quote-annotations = true

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 72
