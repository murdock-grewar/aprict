[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "snookerr"
authors = [
    {name = "Murdock Grewar", email = "murdock.grewar@anu.edu.au"}
]
description = 'Tools to reconstruct tomograms from the triangular X-ray apparatus.'
readme = 'README.md'
requires-python = '>=3.14'
license = {file = 'LICENSE.txt'}
classifiers = [
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
]
dependencies = [
    "cupy>=14.0.1",
    "gpustat>=1.1.1",
    "imageio>=2.37.3",
    "numexpr>=2.14.1",
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "scipy>=1.17.1",
]
dynamic = ['scripts', 'version']

[project.optional-dependencies]
gui = [
    "matplotlib>=3.10.8",
    "pyqtgraph>=0.14.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ipython>=9.11.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-dependency>=0.6.1",
    "pytest-mock>=3.15.1",
    "ruff==0.15.6",
    "setuptools>=82.0.1",
    "ty==0.0.27",
]
gui = [
    "imageio>=2.37.3",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra" # -v --durations=10"  # unnecessary with the conftest.py file
console_output_style = "progress"
testpaths = [
    "src/snookerr/tests",
]

