[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "aprict"
authors = [
    {name = "Murdock Grewar", email = "murdock.grewar@anu.edu.au"}
]
description = 'Tools to simulate and reconstruct XCT transmission data.'
readme = 'README.md'
requires-python = '>=3.14'
license = 'GPL-3.0-or-later'
classifiers = [
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
]
dependencies = [
    "asteval>=1.0.10",
    "click>=8.5.0",
    "click-extra>=9.4.0",
    "cuda-core[cu13]>=1.2.0",
    "cupy-cuda13x[ctk]>=14.2.0",  # the [ctk] extra installs a compatible version of CUDA-toolkit, rather than relying on the system installation of a compatible version. The version 14.2.0 is the minimum required for a cubin caching bugfix to be merged.
    "gpustat>=1.1.1",
    "imageio>=2.37.3",
    "numexpr>=2.14.1",
    "numpy>=2.4.3",
    "pcpp>=1.30",
    "pydantic>=2.12.5",
    "regex>=2026.4.4",
    "rich>=14.3.3",
    "scipy>=1.17.1",
    "tqdm>=4.68.3",
]
dynamic = ['scripts', 'version']

[project.optional-dependencies]
gui = [
    "imageio>=2.37.3",
    "matplotlib>=3.10.8",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "neuroglancer>=2.41.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.6.1",
    "ipython>=9.11.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-dependency>=0.6.1",
    "pytest-mock>=3.15.1",
    "ruff==0.16.10",
    "setuptools>=82.0.1",
    "tuna>=0.5.13",
    "ty==0.0.84",
]
gui = [
    "imageio>=2.37.3",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra" # -v --durations=10"  # unnecessary with the conftest.py file
console_output_style = "progress"
testpaths = [
    "src/aprict/tests",
]

