name: Publish docs/ to github pages

# Activate when a version tagged vX.Y.Z is pushed onto the 'release' branch, or a new such tag created on the 'release' branch
on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches-ignore:
      - '**'
      - '!release'

# security: restrict permissions for CI jobs.
permissions:
  contents: read

jobs:
  # The documentation cannot be built without cupy etc being built, so I do this locally.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6  # check out the repo so that the docs/ directory is available
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
