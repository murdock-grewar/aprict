name: docs-on-github-pages

# Activate when a version tagged vX.Y.Z is pushed onto the 'release' branch, or a new such tag created on the 'release' branch
on:
  create:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches-ignore:
      - '**'
      - '!release'

# security: restrict permissions for CI jobs.
permissions:
  contents: read

jobs:
  # The documentation cannot be built without cupy etc being built, so I do this locally.
  build:
    runs-on: ubuntu-latest
    steps:
  #    - uses: actions/checkout@v6
  #      with:
  #        persist-credentials: false
  #    - uses: actions/setup-python@v6
  #      with:
  #        python-version: '3.14'
  #
  #    # ADJUST THIS: install all dependencies (including pdoc)
  #    - run: pip install -e .
  #    # ADJUST THIS: build your documentation into docs/.
  #    # We use a custom build script for pdoc itself, ideally you just run `pdoc -o docs/ ...` here.
  #    - run: python docs/make.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
