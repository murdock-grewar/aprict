repos:
- repo: local
  hooks:
    - id: generate-cusrc
      name: (Build) Generate CUDA source files
      entry: ./githooks/generate-cusrc.sh
      language: script
      pass_filenames: false
      always_run: true
      verbose: false
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: insert-license # inserts the license header
      name: (Licensing) check license headers
      files: ^src/.*\.py$
      # exclude: ^.*__init__.py$
      args:
        - --license-filepath
        - LICENSE.txt
        - --comment-style
        - "#"
        - --use-current-year
        #- --remove-header # add this line in to remove the header.
- repo: local
  hooks:
    - id: version-increment
      name: (Versioning) auto version increment
      entry: ./githooks/bump-version
      language: script
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
      verbose: false # true: always show output, even when test passes
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.6
  hooks:
    - id: ruff-check
      name: (Linting) ruff check
      types_or: [ python, pyi ]
      #args: [ --fix ]
      #exclude: ^src/snookerr/version.py$ # this file is edited by the version bump script, and may use single or double quotes. ruff check could interfere with it.
    - id: ruff-format
      name: (Formatting) ruff format
      types_or: [ python, pyi ]
      exclude: ^src/snookerr/version.py$ # this file is edited by the version bump script, and may use single or double quotes. It is not aware of ruff format's preference.
- repo: local
  hooks:
    - id: ty
      name: (Type-checking) ty
      #entry: ./.venv/bin/ty check # This isn't sufficient, because ty needs to
      #understand the whole environment to give proper 'unresolved import'
      #errors. So, we need to run it through uv.
      entry: uv run ty check
      language: system # language: system will use the current uv environment instead of having pre-commit create its own isolated tools... e.g. the user will have to run `uv sync`. Otherwise, language: python will use the 'default' behaviour. See https://stackoverflow.com/a/70780205
      #files: \.py
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
    - id: bandit
      name: (Security) bandit
      #entry: uv run bandit -c bandit.toml -q -r src
      #pass_filenames: false
      #always_run: true
      entry: uv run bandit -c bandit.toml -q
      language: system
      pass_filenames: true
    - id: pytest
      name: (Unit tests) pytest
      entry: ./.venv/bin/pytest -vvv
      language: system
      types: [python]
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
