repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.6
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: insert-license # inserts the license header
      files: ^src/.*\.py$
      args:
        - --license-filepath
        - LICENSE.txt
        - --comment-style
        - "#"
        - --use-current-year
        #- --remove-header # add this line in to remove the header.
- repo: local
  hooks:
    - id: version-increment
      name: Auto version increment
      entry: ./githooks/pre-commit
      language: script
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
    - id: pytest
      name: pytest
      entry: ./.venv/bin/pytest
      language: system
      types: [python]
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
