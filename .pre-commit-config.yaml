repos:
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: insert-license # inserts the license header
      name: Checking license headers
      files: ^src/.*\.py$
      args:
        - --license-filepath
        - LICENSE.txt
        - --comment-style
        - "#"
        - --use-current-year
        #- --remove-header # add this line in to remove the header.
- repo: local
  hooks:
    - id: version-increment
      name: Auto version increment
      entry: ./githooks/bump-version
      language: script
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.6
  hooks:
    - id: ruff-check
      name: ruff check
      types_or: [ python, pyi ]
      #args: [ --fix ]
    - id: ruff-format
      name: ruff format
      types_or: [ python, pyi ]
- repo: local
  hooks:
    - id: ty
      name: ty
      #entry: ./.venv/bin/ty check # This isn't sufficient, because ty needs to
      #understand the whole environment to give proper 'unresolved import'
      #errors. So, we need to run it through uv.
      entry: uv run ty check
      language: python
      #files: \.py
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
    - id: pytest
      name: pytest
      entry: ./.venv/bin/pytest
      language: system
      types: [python]
      pass_filenames: false
      always_run: true # run even if there are no matching filenames
